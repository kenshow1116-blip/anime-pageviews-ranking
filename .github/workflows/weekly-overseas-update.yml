name: Weekly Overseas Stats Update

# 海外版(英語版Wikipedia)の閲覧数取得は対象が約7,000件あり、レート制限対策で
# 同時実行数1に制限しているため数時間かかる。日次更新とは別のワークフローにして、
# 週1回だけ実行する。結果はDBに入り、次の日次更新のビルドでサイトに反映される。

on:
  schedule:
    - cron: "0 12 * * 0" # 毎週日曜 UTC 12:00 (JST 21:00)。日次更新(JST 5:00)とは時間をずらす
  workflow_dispatch: {}

# 日次更新と同じグループで直列化する(同じDriveのDBを読み書きするため)
concurrency:
  group: pageviews-db
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}

jobs:
  update-overseas:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # DBはこのリポジトリのGitHub Release「db-cache」に置く(release-sync.js参照)。
      # Releaseにまだ無い初回だけ、以前の保管場所のGoogleドライブから取得する。
      - name: Download cache
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node release-sync.js download data/pageviews.db
          rc=$?
          set -e
          if [ $rc -eq 3 ]; then
            echo "::notice::GitHub ReleaseにDBが無いため、初回のみGoogleドライブから取得します"
            node drive-sync.js download data/pageviews.db
          elif [ $rc -ne 0 ]; then
            exit $rc
          fi

      # ジョブの制限時間(timeout-minutes)で打ち切られると取得分がDriveに書き戻されないため、
      # スクリプト側で時間予算を設けて自分で切り上げる(残りは次回、古い順に取得)
      - name: Fetch overseas (en.wikipedia) stats
        env:
          OVERSEAS_TIME_BUDGET_MIN: "270"
        run: node fetch-overseas-stats.js

      - name: Upload cache
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release-sync.js upload data/pageviews.db

      # 集計結果(data/en-*-stats.json)はリポジトリ管理のファイルなので、コミットしないと次回の日次ビルドに反映されない
      - name: Commit overseas stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/en-*-stats.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update overseas stats $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
