name: Daily Update

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 UTC 20:00 (JST 翌5:00)。混雑時は数十分遅れることがある
  workflow_dispatch:
    inputs:
      max_days:
        description: "取り直す日数の上限(1日約4分。欠けをまとめて埋めるときは40など)"
        required: false
        default: "10"

# 日次・週次の両ワークフローが同じDriveのDBを読み書きするため、同じグループで直列化する
# (同時に走ると後からアップロードした方が、もう片方の更新を上書きして消してしまう)
concurrency:
  group: pageviews-db
  cancel-in-progress: false

permissions:
  contents: write # Release「db-cache」へのDB書き戻しに必要
  pages: write
  id-token: write

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 約10GBのDB + 圧縮ファイル + 約1GBのサイトを置くため、使わないプリインストール物を消して空きを作る
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # DBはこのリポジトリのGitHub Release「db-cache」に置く(release-sync.js参照)。
      # Releaseにまだ無い初回だけ、以前の保管場所のGoogleドライブから取得する。
      - name: Download cache
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node release-sync.js download data/pageviews.db
          rc=$?
          set -e
          if [ $rc -eq 3 ]; then
            echo "::notice::GitHub ReleaseにDBが無いため、初回のみGoogleドライブから取得します"
            node drive-sync.js download data/pageviews.db
          elif [ $rc -ne 0 ]; then
            exit $rc
          fi

      # Wikidataが混雑で失敗することがある。失敗時は出力ファイルが書き換わらず、リポジトリにある
      # 前回の一覧がそのまま使われるので、ここでは止めずに続行する(新作の反映が1日遅れるだけ)
      - name: Fetch anime/manga title lists
        continue-on-error: true
        run: |
          node fetch-all-anime-list.js || echo "::warning::fetch-all-anime-list failed; using previous list"
          node fetch-all-manga-list.js || echo "::warning::fetch-all-manga-list failed; using previous list"

      # 直近45日で未取得の日(失敗した日・スケジュールのずれで飛んだ日)をまとめて取得する。
      # ダンプがまだ公開されていない等で一部失敗しても、取得済みのデータでサイトは更新し、
      # 失敗した日は次回の実行で自動的に再挑戦する。
      - name: Fetch daily pageviews from dump
        continue-on-error: true
        env:
          MAX_DAYS_PER_RUN: ${{ inputs.max_days || '10' }}
        run: node fetch-daily-from-dump.js

      - name: Build pages
        run: |
          node build.js
          node build-seiyuu.js
          node build-manga.js
          node build-categories.js

      # ダウンロードに成功したときだけ書き戻す(失敗時に空や壊れたDBで保管中の本体を上書きしないため)。
      # 途中の手順が失敗しても、取得済みの閲覧数は無駄にしないよう書き戻す。
      - name: Upload cache
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release-sync.js upload data/pageviews.db

      # Google Search Consoleの所有権確認ファイル。消えると定期再確認で所有権が外れる
      - name: Add site verification file
        run: cp google2d2cf974c93a7546.html dist/

      - name: Check site size
        run: |
          du -sh dist
          find dist -type f -size +100M -exec ls -lh {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
